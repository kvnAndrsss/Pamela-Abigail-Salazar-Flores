<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="img/flowers.png" type="image/x-icon" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,600&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
        <title>Para alguien especial</title>
        <style>
            :root {
                --night: #0b0610;
                --rose: #fce7f3;
                --gold: #e0a96d;
                --pink: #d4837c;
            }

            * {
                box-sizing: border-box;
            }

            body {
                align-items: center;
                background: radial-gradient(circle at center, #2d0c22 0%, var(--night) 72%);
                color: var(--rose);
                display: flex;
                flex-direction: column;
                font-family: "Cormorant Garamond", serif;
                justify-content: space-between;
                margin: 0;
                min-height: 100vh;
                overflow-x: hidden;
                padding: 0 24px;
            }

            #fireworks-canvas {
                height: 100vh;
                inset: 0;
                pointer-events: none;
                position: fixed;
                width: 100vw;
                z-index: 0;
            }

            header,
            main,
            footer {
                position: relative;
                z-index: 1;
            }

            header {
                align-items: center;
                display: flex;
                justify-content: space-between;
                max-width: 1040px;
                opacity: 0.82;
                padding: 24px 0;
                width: 100%;
            }

            .eyebrow,
            footer {
                color: #f9a8d4;
                font-size: 0.7rem;
                letter-spacing: 0.28em;
                text-transform: uppercase;
            }

            .spark {
                align-items: center;
                border: 1px solid rgba(244, 168, 208, 0.35);
                border-radius: 50%;
                display: flex;
                height: 34px;
                justify-content: center;
                width: 34px;
            }

            main {
                margin: auto;
                max-width: 680px;
                padding: 48px 0;
                text-align: center;
                width: 100%;
            }

            .glass-card {
                padding: clamp(24px, 6vw, 52px) 0;
                position: relative;
            }

            .glass-card::before {
                display: none;
            }

            .badge {
                color: #f9a8d4;
                display: inline-block;
                font-family: "Cormorant Garamond", serif;
                font-size: 1.2rem;
                font-style: italic;
                letter-spacing: 0.08em;
                margin-bottom: 16px;
                position: relative;
                text-transform: uppercase;
            }

            h1 {
                background: linear-gradient(90deg, #fecdd3, #fdf2f8, #fde68a);
                background-clip: text;
                color: transparent;
                font-family: "Great Vibes", cursive;
                font-size: clamp(3.6rem, 10vw, 6.5rem);
                font-weight: 400;
                line-height: 1.15;
                margin: 0 0 24px;
                position: relative;
            }

            .intro {
                color: rgba(251, 207, 232, 0.78);
                font-size: clamp(1.3rem, 2.5vw, 1.65rem);
                font-style: italic;
                font-weight: 400;
                line-height: 1.5;
                margin: 0 auto 34px;
                max-width: 530px;
                position: relative;
            }

            button,
            .page-link {
                align-items: center;
                border: 0;
                border-radius: 999px;
                cursor: pointer;
                display: inline-flex;
                font-family: "Cormorant Garamond", serif;
                font-size: 0.8rem;
                font-weight: 600;
                justify-content: center;
                letter-spacing: 0.12em;
                padding: 15px 24px;
                text-decoration: none;
                text-transform: none;
            }

            button {
                background: linear-gradient(135deg, var(--gold), var(--pink));
                box-shadow: 0 0 25px rgba(212, 131, 124, 0.4);
                color: white;
                transition: transform 220ms ease, box-shadow 220ms ease;
            }

            button:hover,
            button:focus-visible {
                box-shadow: 0 0 35px rgba(225, 169, 109, 0.7);
                outline: 2px solid #fce7f3;
                outline-offset: 3px;
                transform: translateY(-3px);
            }

            .heart {
                font-size: 1rem;
                margin-left: 9px;
            }

            .links {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
                margin-top: 18px;
            }

            .page-link {
                border: 1px solid rgba(249, 168, 212, 0.3);
                color: #fbcfe8;
                font-size: 1.1rem;
                padding: 11px 17px;
                transition: background 180ms ease, color 180ms ease;
            }

            .page-link:hover,
            .page-link:focus-visible {
                background: #fbcfe8;
                color: #2d0c22;
                outline: none;
            }

            footer {
                opacity: 0.5;
                padding: 24px 0;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <canvas id="fireworks-canvas" aria-hidden="true"></canvas>



        <main>
            <section class="glass-card" aria-labelledby="page-title">
                <span class="badge">Hola mi Amor</span>
                <h1 id="page-title">Para Pamela Abigail la mujer que no quiero perder</h1>
                <p class="intro">
                    Esta pagina web la hice para tí con mucho amor.
                    Quiero estar contigo y mejoraré para ello. 
                    de parte de un terco que te ama y que quiere estar contigo para siempre.
                </p>
                <button type="button" id="heart-button">
                    Lanzar corazón <span class="heart" aria-hidden="true">♥</span>
                </button>
                <nav class="links" aria-label="Más recuerdos">
                    <a class="page-link" href="flower.html">presiona aquí amor</a>
                </nav>
            </section>
        </main>



        <script>
            const canvas = document.getElementById("fireworks-canvas");
            const context = canvas.getContext("2d");
            const heartButton = document.getElementById("heart-button");
            const palettes = [
                ["#ff77a9", "#ffb6c1", "#ffd1dc", "#ffffff"],
                ["#e0a96d", "#ffd700", "#ffaa33", "#ffffff"],
                ["#d4837c", "#b76e79", "#ff9999", "#ffccd5"]
            ];
            let width = 0;
            let height = 0;
            let particles = [];
            let fireworks = [];
            let autoFireTimer = 0;

            function resizeCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            function addExplosion(x, y, palette, isHeart) {
                const count = isHeart ? 160 : 80;
                for (let i = 0; i < count; i += 1) {
                    const angle = isHeart
                        ? (i / count) * Math.PI * 2
                        : Math.random() * Math.PI * 2;
                    const heartX = 16 * Math.pow(Math.sin(angle), 3);
                    const heartY = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                    const speed = isHeart ? Math.random() * 0.22 + 0.18 : Math.random() * 4 + 1;
                    particles.push({
                        x,
                        y,
                        vx: isHeart ? heartX * speed : Math.cos(angle) * speed,
                        vy: isHeart ? heartY * speed : Math.sin(angle) * speed,
                        alpha: 1,
                        color: palette[Math.floor(Math.random() * palette.length)],
                        size: Math.random() * 1.5 + 0.8
                    });
                }
            }

            function launchFirework(targetX, targetY, palette, isHeart) {
                fireworks.push({
                    x: Math.random() * width,
                    y: height,
                    targetX,
                    targetY,
                    palette,
                    isHeart,
                    speed: 5
                });
            }

            function drawFrame() {
                requestAnimationFrame(drawFrame);
                context.fillStyle = "rgba(11, 6, 16, 0.2)";
                context.fillRect(0, 0, width, height);

                for (let i = fireworks.length - 1; i >= 0; i -= 1) {
                    const firework = fireworks[i];
                    const deltaX = firework.targetX - firework.x;
                    const deltaY = firework.targetY - firework.y;
                    const distance = Math.hypot(deltaX, deltaY);
                    if (distance < firework.speed) {
                        fireworks.splice(i, 1);
                        addExplosion(firework.targetX, firework.targetY, firework.palette, firework.isHeart);
                        continue;
                    }
                    firework.x += (deltaX / distance) * firework.speed;
                    firework.y += (deltaY / distance) * firework.speed;
                    context.fillStyle = firework.palette[0];
                    context.fillRect(firework.x, firework.y, 2, 8);
                }

                for (let i = particles.length - 1; i >= 0; i -= 1) {
                    const particle = particles[i];
                    particle.vx *= 0.95;
                    particle.vy = particle.vy * 0.95 + 0.04;
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.alpha -= 0.012;
                    context.globalAlpha = Math.max(0, particle.alpha);
                    context.fillStyle = particle.color;
                    context.beginPath();
                    context.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    context.fill();
                    if (particle.alpha <= 0) particles.splice(i, 1);
                }
                context.globalAlpha = 1;

                autoFireTimer += 1;
                if (autoFireTimer > 100) {
                    launchFirework(Math.random() * width * 0.6 + width * 0.2, Math.random() * height * 0.4 + height * 0.15, palettes[Math.floor(Math.random() * palettes.length)], Math.random() > 0.3);
                    autoFireTimer = 0;
                }
            }

            window.addEventListener("resize", resizeCanvas);
            heartButton.addEventListener("click", function () {
                launchFirework(width / 2, height * 0.35, palettes[0], true);
            });
            resizeCanvas();
            drawFrame();
        </script>
    </body>
</html>
